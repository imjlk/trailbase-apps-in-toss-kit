[package]
name = "trailbase-guest-common"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
hex.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
trailbase-wasm.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }

[features]
compat-smoke = []

[[example]]
name = "compat_smoke"
crate-type = ["cdylib"]
required-features = ["compat-smoke"]
test = false
