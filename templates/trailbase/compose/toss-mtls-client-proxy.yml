services:
  toss-mtls-client-proxy:
    image: ${TOSS_MTLS_CLIENT_PROXY_IMAGE:-ghcr.io/imjlk/trailbase-apps-in-toss-kit/toss-mtls-client-proxy:0.1.2}
    profiles:
      - toss-proxy
    expose:
      - "8787"
    environment:
      MTLS_PROXY_MODE: ${MTLS_PROXY_MODE:-stub}
      MTLS_PROXY_TOKEN: ${MTLS_PROXY_TOKEN:-}
      MTLS_UPSTREAM_BASE_URL: ${MTLS_UPSTREAM_BASE_URL:-}
      MTLS_CERT_DIR: ${MTLS_CERT_DIR:-/run/mtls}
      MTLS_CLIENT_CERT_PATH: ${MTLS_CLIENT_CERT_PATH:-}
      MTLS_CLIENT_KEY_PATH: ${MTLS_CLIENT_KEY_PATH:-}
      MTLS_CA_CERT_PATH: ${MTLS_CA_CERT_PATH:-}
      MTLS_PROXY_REQUEST_BODY_LIMIT_BYTES: ${MTLS_PROXY_REQUEST_BODY_LIMIT_BYTES:-1048576}
      MTLS_PROXY_UPSTREAM_BODY_LIMIT_BYTES: ${MTLS_PROXY_UPSTREAM_BODY_LIMIT_BYTES:-2097152}
      MTLS_PROXY_UPSTREAM_TIMEOUT_MS: ${MTLS_PROXY_UPSTREAM_TIMEOUT_MS:-15000}
      MTLS_PROXY_IAP_ORDER_STATUS_MAX_ATTEMPTS: ${MTLS_PROXY_IAP_ORDER_STATUS_MAX_ATTEMPTS:-6}
      MTLS_PROXY_IAP_ORDER_STATUS_RETRY_DELAY_MS: ${MTLS_PROXY_IAP_ORDER_STATUS_RETRY_DELAY_MS:-350}
      MTLS_PROXY_DEBUG: ${MTLS_PROXY_DEBUG:-}
      TOSS_PROMOTION_CODE: ${TOSS_PROMOTION_CODE:-}
      TOSS_PROMOTION_AMOUNT: ${TOSS_PROMOTION_AMOUNT:-50}
    volumes:
      - mtls_client_certs:/run/mtls:ro
    restart: unless-stopped

volumes:
  mtls_client_certs:
