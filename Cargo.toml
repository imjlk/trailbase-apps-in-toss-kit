[workspace]
resolver = "2"
members = [
  "crates/trailbase-guest-common",
  "crates/trailbase-toss-identity"
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.11.0"
trailbase-wasm = "0.6.1"
url = "2.5.7"
