[workspace]
resolver = "2"
members = [
  "crates/trailbase-guest-common",
  "crates/trailbase-toss-identity"
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.11.0"
trailbase-wasm = "0.5.1"
