name: agent skills

on:
  pull_request:
    paths:
      - ".github/workflows/codex-skills.yml"
      - "skills/**"
      - "scripts/sync-agent-skills.mjs"
      - "scripts/sync-codex-skills.mjs"
      - "scripts/validate-agent-skills.mjs"
      - "scripts/validate-codex-skills.mjs"
      - "docs/en/agent-skills.md"
      - "docs/ko/agent-skills.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING-ko.md"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-skills.yml"
      - "skills/**"
      - "scripts/sync-agent-skills.mjs"
      - "scripts/sync-codex-skills.mjs"
      - "scripts/validate-agent-skills.mjs"
      - "scripts/validate-codex-skills.mjs"
      - "docs/en/agent-skills.md"
      - "docs/ko/agent-skills.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING-ko.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-skills-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.5"

jobs:
  validate:
    name: Validate agent skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate skills
        run: bun run skills:validate
