name: agent skills

on:
  pull_request:
    paths:
      - ".github/workflows/codex-skills.yml"
      - "skills/**"
      - "scripts/sync-agent-skills.mjs"
      - "scripts/sync-codex-skills.mjs"
      - "scripts/validate-agent-skills.mjs"
      - "scripts/validate-codex-skills.mjs"
      - "docs/skills.md"
      - "CONTRIBUTING.md"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-skills.yml"
      - "skills/**"
      - "scripts/sync-agent-skills.mjs"
      - "scripts/sync-codex-skills.mjs"
      - "scripts/validate-agent-skills.mjs"
      - "scripts/validate-codex-skills.mjs"
      - "docs/skills.md"
      - "CONTRIBUTING.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-skills-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  validate:
    name: Validate agent skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate skills
        run: bun run skills:validate
