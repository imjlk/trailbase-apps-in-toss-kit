name: js packages

on:
  pull_request:
    paths:
      - ".github/workflows/js-packages.yml"
      - "bun.lock"
      - "package.json"
      - "packages/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/js-packages.yml"
      - "bun.lock"
      - "package.json"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  test:
    name: Test JS packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run package tests
        run: bun run packages:test
