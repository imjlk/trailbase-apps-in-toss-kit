name: js packages

on:
  pull_request:
    paths:
      - ".github/workflows/js-packages.yml"
      - "bun.lock"
      - "package.json"
      - "tsconfig*.json"
      - "scripts/check-sdk-minimum.mjs"
      - "packages/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/js-packages.yml"
      - "bun.lock"
      - "package.json"
      - "tsconfig*.json"
      - "scripts/check-sdk-minimum.mjs"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: js-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  test:
    name: Test JS packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run package tests
        run: bun run packages:test

      - name: Check package sources against installed SDK types
        run: bun run packages:typecheck

      - name: Check package sources against minimum supported RN SDK types
        run: bun run packages:typecheck:minimum
