name: toss-mtls-client-proxy image

on:
  pull_request:
    paths:
      - ".github/workflows/toss-mtls-client-proxy-image.yml"
      - "services/toss-mtls-client-proxy/**"
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/toss-mtls-client-proxy-image.yml"
      - "services/toss-mtls-client-proxy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toss-mtls-client-proxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/toss-mtls-client-proxy
  BUN_VERSION: "1.2.21"

jobs:
  test:
    name: Test proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/toss-mtls-client-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run tests
        run: bun test

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/toss-mtls-client-proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
