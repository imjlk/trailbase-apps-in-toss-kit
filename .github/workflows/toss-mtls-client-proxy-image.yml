name: toss-mtls-client-proxy image

on:
  pull_request:
    paths:
      - ".github/workflows/toss-mtls-client-proxy-image.yml"
      - "services/toss-mtls-client-proxy/**"
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "toss-mtls-client-proxy-v*.*.*"
    paths:
      - ".github/workflows/toss-mtls-client-proxy-image.yml"
      - "services/toss-mtls-client-proxy/**"
  schedule:
    # Twice-monthly rebuild to pick up patched base images even when proxy source is unchanged.
    - cron: "17 18 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: toss-mtls-client-proxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/toss-mtls-client-proxy
  BUN_VERSION: "1.3.13"

jobs:
  test:
    name: Test proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/toss-mtls-client-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run tests
        run: bun test

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          is_release=false
          create_tag=false
          version=""
          major=""
          major_minor=""
          tag_name=""

          package_version="$(node -p "require('./services/toss-mtls-client-proxy/package.json').version")"

          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported package version: ${package_version}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#toss-mtls-client-proxy-v}"
            version="${version#v}"

            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: ${tag}" >&2
              exit 1
            fi

            if [[ "${version}" != "${package_version}" ]]; then
              echo "Tag version ${version} does not match package.json version ${package_version}" >&2
              exit 1
            fi

            is_release=true
            tag_name="${tag}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            version="${package_version}"
            tag_name="toss-mtls-client-proxy-v${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
              is_release=true
              create_tag=true
            fi
          fi

          if [[ "${is_release}" == "true" ]]; then
            IFS='.' read -r major minor _ <<< "${version}"
            major_minor="${major}.${minor}"
          fi

          {
            echo "is_release=${is_release}"
            echo "create_tag=${create_tag}"
            echo "version=${version}"
            echo "major=${major}"
            echo "major_minor=${major_minor}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create proxy release tag
        if: steps.release.outputs.create_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag_name }}" -m "Release toss-mtls-client-proxy ${{ steps.release.outputs.version }}"
          git push origin "refs/tags/${{ steps.release.outputs.tag_name }}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.release.outputs.major_minor }},enable=${{ steps.release.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/toss-mtls-client-proxy/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
