name: Apps in Toss tracking

on:
  pull_request:
    paths:
      - ".github/workflows/apps-in-toss-tracking.yml"
      - "bun.lock"
      - "data/upstream/apps-in-toss/**"
      - "docs/en/apps-in-toss-tracking.md"
      - "docs/ko/apps-in-toss-tracking.md"
      - "package.json"
      - "renovate.json"
      - "scripts/check-apps-in-toss-tracking.mjs"
      - "scripts/snapshot-apps-in-toss-docs.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apps-in-toss-tracking.yml"
      - "bun.lock"
      - "data/upstream/apps-in-toss/**"
      - "docs/en/apps-in-toss-tracking.md"
      - "docs/ko/apps-in-toss-tracking.md"
      - "package.json"
      - "renovate.json"
      - "scripts/check-apps-in-toss-tracking.mjs"
      - "scripts/snapshot-apps-in-toss-docs.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-in-toss-tracking-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.13"

jobs:
  check:
    name: Check Apps in Toss tracking metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Test snapshot response validation
        run: bun run apps-in-toss:snapshot:test

      - name: Check tracking metadata
        run: bun run apps-in-toss:tracking:check
