name: Sampo release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sampo-release.yml"
      - ".sampo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "crates/**/CHANGELOG.md"
      - "packages/**/package.json"
      - "packages/**/CHANGELOG.md"
      - "services/**/package.json"
      - "services/**/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: sampo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SAMPO_RELEASE_TOKEN || secrets.TRAILBASE_RELEASE_WATCH_TOKEN || github.token }}

      - name: Setup mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          if [ -d .sampo/changesets ]; then
            count="$(find .sampo/changesets -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          else
            count="0"
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No pending changesets; skipping Sampo release PR generation."
          fi

      - name: Run Sampo release automation
        if: steps.changesets.outputs.count != '0'
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@cargo-sampo-github-action-v0.16.0
        with:
          command: auto
          base-branch: main
          pr-branch: release/main
          pr-title: "chore: release packages"
          github-token: ${{ secrets.SAMPO_RELEASE_TOKEN || secrets.TRAILBASE_RELEASE_WATCH_TOKEN || github.token }}
          create-github-release: false
          open-discussion: false
        env:
          GITHUB_TOKEN: ${{ secrets.SAMPO_RELEASE_TOKEN || secrets.TRAILBASE_RELEASE_WATCH_TOKEN || github.token }}
