name: rust helpers

on:
  pull_request:
    paths:
      - "fixtures/contracts/**"
      - "scripts/promotion-recipient-contract.test.mjs"
      - "services/toss-mtls-client-proxy/**"
      - "packages/trailbase-runtime/**"
      - "templates/trailbase/release/promotion-release-doctor.config.example.json"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/rust.yml"
      - ".mise.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
    paths:
      - "fixtures/contracts/**"
      - "scripts/promotion-recipient-contract.test.mjs"
      - "services/toss-mtls-client-proxy/**"
      - "packages/trailbase-runtime/**"
      - "templates/trailbase/release/promotion-release-doctor.config.example.json"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/rust.yml"
      - ".mise.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Rust helpers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup mise tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check WASI build
        run: cargo check --workspace --target wasm32-wasip2

      - name: Verify Rust promotion payloads through the proxy
        run: |
          bun install --frozen-lockfile
          bun test scripts/promotion-recipient-contract.test.mjs --timeout 120000
