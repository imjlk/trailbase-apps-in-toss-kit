name: rust helpers

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".mise.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - ".mise.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Rust helpers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install Rust components
        run: |
          rustup component add rustfmt clippy
          rustup target add wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check WASI build
        run: cargo check --workspace --target wasm32-wasip2
