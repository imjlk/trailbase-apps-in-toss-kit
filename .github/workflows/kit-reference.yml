name: Kit reference evidence
on:
  # Cover every input, including future source, fixture and toolchain changes.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    name: Verify kit reference and retain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run the isolated kit reference checks
        run: bun scripts/run-kit-reference.mjs --output "$RUNNER_TEMP/kit-reference.json"
      - name: Retain redacted evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kit-reference-${{ github.sha }}
          path: ${{ runner.temp }}/kit-reference.json
          if-no-files-found: error
          retention-days: 30
