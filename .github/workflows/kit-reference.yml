name: Kit reference evidence
on:
  # Cover every input, including future source, fixture and toolchain changes.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kit-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    name: Verify kit reference and retain evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          cache: true
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Run the isolated kit reference checks
        run: bun scripts/run-kit-reference.mjs --output "$RUNNER_TEMP/kit-reference.json"
      - name: Retain redacted evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-reference-${{ github.sha }}
          path: ${{ runner.temp }}/kit-reference.json
          if-no-files-found: error
          retention-days: 30
