name: Windows development

on:
  pull_request:
    paths:
      - ".github/workflows/windows-development.yml"
      - ".gitattributes"
      - ".mise.toml"
      - "rust-toolchain.toml"
      - "Cargo*"
      - "crates/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "packages/**"
      - "services/toss-mtls-client-proxy/**"
      - "scripts/**"
      - "skills/**"
      - "fixtures/**"
      - "templates/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-development.yml"
      - ".gitattributes"
      - ".mise.toml"
      - "rust-toolchain.toml"
      - "Cargo*"
      - "crates/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "packages/**"
      - "services/toss-mtls-client-proxy/**"
      - "scripts/**"
      - "skills/**"
      - "fixtures/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
      - name: Install locked JS dependencies
        run: bun install --frozen-lockfile
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check native Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run native Rust tests
        run: cargo test --locked --workspace
      - name: Check WASI target
        run: cargo check --locked --workspace --target wasm32-wasip2
      - name: Run native Node tooling tests
        run: node --test scripts/cargo-local.test.mjs scripts/cargo-cache-report.test.mjs scripts/validate-agent-skills.test.mjs
      - name: Run packages, proxy and consumer tooling tests
        run: bun test packages services scripts templates/clients/review-request --timeout 120000
      - name: Check installed SDK types
        run: bun run packages:typecheck
      - name: Check minimum supported SDK types
        run: bun run packages:typecheck:minimum
      - name: Validate agent skills
        run: bun run skills:validate
      - name: Smoke SQL templates
        run: |
          bun run trailbase:functional-ledgers:smoke
          bun run trailbase:owned-currency:smoke
