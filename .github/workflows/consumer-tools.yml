name: Consumer upgrade tools

on:
  pull_request:
    paths:
      - ".github/workflows/consumer-tools.yml"
      - "scripts/*consumer*"
      - "data/webview-migration-map.json"
      - "scripts/cargo-*.mjs"
      - "scripts/lib/consumer-*.mjs"
      - "templates/trailbase/**"
      - "templates/github-runner/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/consumer-tools.yml"
      - "scripts/*consumer*"
      - "data/webview-migration-map.json"
      - "scripts/cargo-*.mjs"
      - "scripts/lib/consumer-*.mjs"
      - "templates/trailbase/**"
      - "templates/github-runner/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test consumer upgrade tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - run: bun test scripts/compare-consumer-templates.test.mjs scripts/consumer-upgrade-plan.test.mjs
      - run: node --test scripts/cargo-local.test.mjs scripts/cargo-cache-report.test.mjs
      - run: node --test scripts/check-consumer-webview-migration.test.mjs
      - run: node --test templates/github-runner/scripts/prepare-self-hosted-ci.test.mjs
